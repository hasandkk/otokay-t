<!DOCTYPE html>
<html lang="tr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teminat Group Servis — Önizleme</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #273449;
    --border: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --primary: #2563eb;
    --primary-h: #1d4ed8;
    --green: #16a34a;
    --amber: #d97706;
    --red: #dc2626;
    --radius: 12px;
    --shadow: 0 6px 24px rgba(0,0,0,.35);
  }
  /* AÇIK TEMA */
  :root[data-theme="light"] {
    --bg: #eef2f7;
    --surface: #ffffff;
    --surface-2: #f1f5f9;
    --border: #d8e0ea;
    --text: #0f172a;
    --muted: #64748b;
    --primary: #2563eb;
    --primary-h: #1d4ed8;
    --shadow: 0 6px 20px rgba(15,23,42,.10);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.45;
    padding-bottom: 40px;
    transition: background .2s, color .2s;
  }
  .hidden { display: none !important; }

  /* TOPBAR */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 8px; cursor: pointer; flex-shrink: 0; }
  .logo { font-size: 22px; }
  .brand-name { font-weight: 700; font-size: 17px; white-space: nowrap; }
  .search-wrap { position: relative; flex: 1; max-width: 640px; }
  #globalSearch {
    width: 100%; padding: 10px 14px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); font-size: 15px;
  }
  #globalSearch:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  .search-results {
    position: absolute; top: 110%; left: 0; right: 0; z-index: 40;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
    max-height: 60vh; overflow: auto;
  }
  .search-results .sr-item {
    padding: 10px 14px; cursor: pointer; border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; gap: 10px;
  }
  .search-results .sr-item:hover { background: var(--surface-2); }
  .sr-plaka { font-weight: 700; letter-spacing: .5px; }
  .sr-meta { color: var(--muted); font-size: 13px; }

  .icon-btn {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    width: 40px; height: 40px; border-radius: 10px; cursor: pointer; font-size: 18px; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--border); }

  /* TABS */
  .tabs {
    display: flex; gap: 6px; padding: 10px 14px 0;
    overflow-x: auto;
  }
  .tab {
    background: transparent; border: none; color: var(--muted);
    padding: 8px 14px; border-radius: 10px 10px 0 0; cursor: pointer; font-size: 15px;
    white-space: nowrap;
  }
  .tab.active { color: var(--text); background: var(--surface); font-weight: 600; }

  main { max-width: 1000px; margin: 0 auto; padding: 16px 14px; }
  .loading { text-align: center; color: var(--muted); padding: 40px; }

  /* CARDS */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
  }
  .card h2, .card h3 { margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; }
  .row > * { flex: 1; min-width: 160px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; text-align: center; }
  .stat .num { font-size: 30px; font-weight: 800; }
  .stat .lbl { color: var(--muted); font-size: 13px; margin-top: 4px; }

  /* BUTTONS */
  .btn {
    background: var(--primary); color: #fff; border: none; border-radius: 10px;
    padding: 10px 16px; font-size: 15px; cursor: pointer; font-weight: 600;
  }
  .btn:hover { background: var(--primary-h); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.secondary { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
  .btn.secondary:hover { background: var(--border); }
  .btn.green { background: var(--green); }
  .btn.amber { background: var(--amber); }
  .btn.red { background: var(--red); }
  .btn.sm { padding: 6px 10px; font-size: 13px; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

  /* FORMS */
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  input, select, textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font-size: 15px; font-family: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); border-color: var(--primary); }
  textarea { resize: vertical; min-height: 60px; }
  .field { margin-bottom: 12px; }
  .checkbox-field { display: flex; align-items: center; gap: 8px; }
  .checkbox-field input { width: auto; }

  /* TABLES / LISTS */
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  td.right, th.right { text-align: right; }
  .list-item {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
    background: var(--surface-2); cursor: pointer;
  }
  .list-item:hover { border-color: var(--primary); }
  .list-item .meta { color: var(--muted); font-size: 13px; }

  /* BADGES */
  .badge { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .badge.Beklemede { background: #475569; color: #fff; }
  .badge.DevamEdiyor { background: var(--amber); color: #fff; }
  .badge.Tamamlandi { background: var(--green); color: #fff; }
  .badge.TeslimEdildi { background: var(--primary); color: #fff; }
  .badge.tur { background: var(--surface-2); border: 1px solid var(--border); color: var(--muted); }

  .muted { color: var(--muted); }
  .right { text-align: right; }
  .total-line { display: flex; justify-content: space-between; padding: 6px 0; }
  .total-line.grand { font-size: 20px; font-weight: 800; border-top: 2px solid var(--border); margin-top: 6px; padding-top: 10px; }

  .breadcrumb { color: var(--muted); font-size: 13px; margin-bottom: 12px; cursor: pointer; }
  .breadcrumb:hover { color: var(--text); }

  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .empty { text-align: center; color: var(--muted); padding: 24px; }

  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50;
    display: flex; align-items: flex-start; justify-content: center; padding: 24px 14px; overflow: auto;
  }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    width: 100%; max-width: 520px; box-shadow: var(--shadow); margin-top: 4vh;
  }
  .modal.wide { max-width: 720px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid var(--border); }
  .modal-head h3 { margin: 0; }
  .modal-body { padding: 16px; }
  .modal-foot { padding: 14px 16px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    padding: 12px 20px; border-radius: 10px; box-shadow: var(--shadow); z-index: 100; max-width: 90vw;
  }
  .toast.err { border-color: var(--red); }
  .toast.ok { border-color: var(--green); }

  .pagination { display: flex; gap: 8px; justify-content: center; align-items: center; margin-top: 12px; }

  /* ÖZET / YAZDIRMA */
  .summary-sheet { background: #fff; color: #111; border-radius: var(--radius); padding: 24px; }
  .summary-sheet h1, .summary-sheet h2, .summary-sheet h3 { color: #111; }
  .summary-sheet table th, .summary-sheet table td { border-bottom: 1px solid #ddd; }
  .summary-sheet th { color: #555; }
  .summary-sheet .total-line.grand { border-top: 2px solid #111; }
  .summary-head { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 12px; border-bottom: 2px solid #111; padding-bottom: 12px; margin-bottom: 16px; }

  @media (max-width: 600px) {
    .brand-name { display: none; }
    main { padding: 12px 10px; }
    th.hide-sm, td.hide-sm { display: none; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .topbar, .tabs, #toast, .no-print, .modal-foot, .modal-head .icon-btn { display: none !important; }
    .modal-overlay { position: static; background: #fff; padding: 0; display: block; }
    .modal { max-width: 100%; border: none; box-shadow: none; margin: 0; }
    .summary-sheet { padding: 0; }
  }
</style>

</head>
<body>

  <!-- ÜST BAR -->
  <header class="topbar">
    <div class="brand" onclick="App.goHome()">
      <span class="logo">🛡️</span>
      <span class="brand-name" id="brandName">Teminat Group</span>
    </div>
    <div class="search-wrap">
      <input id="globalSearch" type="search" autocomplete="off"
             placeholder="Plaka, müşteri adı veya telefon ara..."
             oninput="App.onSearchInput()" onkeydown="App.onSearchKey(event)">
      <div id="searchResults" class="search-results hidden"></div>
    </div>
    <button class="icon-btn" id="sheetBtn" title="Google E-Tablo'yu aç" onclick="App.openSheet()">📋</button>
    <button class="icon-btn" id="themeBtn" title="Tema değiştir" onclick="App.toggleTheme()">🌙</button>
    <button class="icon-btn" title="Ayarlar" onclick="App.openSettings()">⚙️</button>
  </header>

  <!-- SEKME ÇUBUĞU -->
  <nav class="tabs">
    <button class="tab active" data-tab="home" onclick="App.tab('home')">🏠 Ana Sayfa</button>
    <button class="tab" data-tab="reports" onclick="App.tab('reports')">📊 Raporlar</button>
    <button class="tab" data-tab="customers" onclick="App.tab('customers')">👤 Müşteriler</button>
  </nav>

  <main id="view"><div class="loading">Yükleniyor…</div></main>

  <!-- MODAL KATMANI -->
  <div id="modalRoot"></div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  


<script>
/* ============ SAHTE BACKEND (yalnızca önizleme) ============ */
(function () {
  function uid(p){ return p + '_' + Math.random().toString(36).slice(2,10); }
  function num(v){ var n = Number(v); return isNaN(n) ? 0 : n; }
  function r2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
  function now(){
    var d = new Date(), p = function(x){ return ('0'+x).slice(-2); };
    return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }

  // ---- Başlangıç (örnek) verisi ----
  var DB = {
    settings: { kdvOrani: 20, firmaAdi: 'Teminat Group', firmaTelefon: '0212 555 12 34', firmaAdres: 'Sanayi Mah. 5. Sok. No:12, İstanbul', tema: 'dark' },
    sonServisNo: 2,
    musteriler: [
      { MusteriID:'M_ahmet', AdSoyad:'Ahmet Yılmaz', Telefon:'0532 111 22 33', Notlar:'Düzenli müşteri', KayitTarihi:'2026-01-10 09:00', Aktif:true },
      { MusteriID:'M_zeynep', AdSoyad:'Zeynep Kaya', Telefon:'0505 444 55 66', Notlar:'', KayitTarihi:'2026-03-02 14:20', Aktif:true }
    ],
    araclar: [
      { AracID:'A_34abc', MusteriID:'M_ahmet', Plaka:'34 ABC 123', Tur:'Otomobil', Marka:'Renault', Model:'Clio', Yil:'2018', Notlar:'', Aktif:true },
      { AracID:'A_34xyz', MusteriID:'M_ahmet', Plaka:'34 XYZ 789', Tur:'Otomobil', Marka:'Fiat', Model:'Egea', Yil:'2021', Notlar:'', Aktif:true },
      { AracID:'A_06moto', MusteriID:'M_zeynep', Plaka:'06 MTR 35', Tur:'Motosiklet', Marka:'Honda', Model:'PCX 125', Yil:'2022', Notlar:'Kasko var', Aktif:true }
    ],
    servisler: [
      { ServisID:'S_1', AracID:'A_34abc', ServisNo:'2026-0001', Tarih:'2026-05-15 10:30', Durum:'Teslim Edildi', GenelNot:'Periyodik bakım', KdvOrani:20, KdvDahil:false },
      { ServisID:'S_2', AracID:'A_34abc', ServisNo:'2026-0002', Tarih:'2026-06-20 16:00', Durum:'Devam Ediyor', GenelNot:'', KdvOrani:20, KdvDahil:false },
      { ServisID:'S_3', AracID:'A_06moto', ServisNo:'2026-0003', Tarih:'2026-06-25 11:15', Durum:'Tamamlandi', GenelNot:'Zincir ve yağ', KdvOrani:20, KdvDahil:false },
      { ServisID:'S_4', AracID:'A_34xyz', ServisNo:'2026-0004', Tarih:'2026-06-28 09:00', Durum:'Beklemede', GenelNot:'', KdvOrani:20, KdvDahil:false }
    ],
    iscilikler: [
      { KalemID:'I_1', ServisID:'S_1', Aciklama:'Yağ ve filtre değişim işçiliği', Tutar:500 },
      { KalemID:'I_2', ServisID:'S_1', Aciklama:'Genel kontrol', Tutar:250 },
      { KalemID:'I_3', ServisID:'S_2', Aciklama:'Balata değişimi', Tutar:400 },
      { KalemID:'I_4', ServisID:'S_3', Aciklama:'Zincir ayarı ve yağlama', Tutar:300 }
    ],
    parcalar: [
      { KalemID:'P_1', ServisID:'S_1', ParcaAdi:'Motor yağı 5W30', Adet:4, BirimFiyat:180, Tutar:720 },
      { KalemID:'P_2', ServisID:'S_1', ParcaAdi:'Yağ filtresi', Adet:1, BirimFiyat:150, Tutar:150 },
      { KalemID:'P_3', ServisID:'S_2', ParcaAdi:'Ön fren balatası', Adet:1, BirimFiyat:850, Tutar:850 },
      { KalemID:'P_4', ServisID:'S_3', ParcaAdi:'Motosiklet zinciri', Adet:1, BirimFiyat:600, Tutar:600 }
    ]
  };

  var DURUMLAR = ['Beklemede','Devam Ediyor','Tamamlandi','Teslim Edildi'];

  function mapArac(a){ return { AracID:a.AracID, MusteriID:a.MusteriID, Plaka:a.Plaka, Tur:a.Tur, Marka:a.Marka, Model:a.Model, Yil:a.Yil, Notlar:a.Notlar }; }
  function mapServis(s){
    return { ServisID:s.ServisID, AracID:s.AracID, ServisNo:s.ServisNo, Tarih:s.Tarih, Durum:s.Durum, GenelNot:s.GenelNot,
      IscilikToplam:num(s.IscilikToplam), ParcaToplam:num(s.ParcaToplam), KdvOrani:num(s.KdvOrani),
      KdvDahil:!!s.KdvDahil, KdvTutar:num(s.KdvTutar), GenelToplam:num(s.GenelToplam) };
  }
  function byId(arr, key, val){ return arr.filter(function(x){ return x[key]===val; })[0]; }

  function recalc(servisId){
    var s = byId(DB.servisler,'ServisID',servisId); if(!s) return;
    var it = DB.iscilikler.filter(function(i){return i.ServisID===servisId;}).reduce(function(a,i){return a+num(i.Tutar);},0);
    var pt = DB.parcalar.filter(function(p){return p.ServisID===servisId;}).reduce(function(a,p){return a+num(p.Tutar);},0);
    // Fiyatlar her zaman NET girilir; KDV daima üzerine eklenir. KdvDahil sadece gösterim bayrağı.
    var ara = it+pt, oran = num(s.KdvOrani)/100;
    var kdv = ara*oran, gen = ara+kdv;
    s.IscilikToplam=r2(it); s.ParcaToplam=r2(pt); s.KdvTutar=r2(kdv); s.GenelToplam=r2(gen);
  }
  // İlk yüklemede toplamları hesapla
  DB.servisler.forEach(function(s){ recalc(s.ServisID); });

  var Backend = {
    getBootstrapData: function(){
      var acik = DB.servisler.filter(function(s){return s.Durum!=='Teslim Edildi';}).length;
      return { settings:DB.settings, durumlar:DURUMLAR, sheetUrl:'', stats:{
        musteriSayisi: DB.musteriler.filter(function(m){return m.Aktif;}).length,
        aracSayisi: DB.araclar.filter(function(a){return a.Aktif;}).length,
        acikServis: acik, toplamServis: DB.servisler.length
      }};
    },
    search: function(q){
      q = (q||'').toLowerCase().trim(); var qp = q.replace(/\s+/g,'');
      if(!q) return {araclar:[]};
      var out = [];
      DB.araclar.filter(function(a){return a.Aktif;}).forEach(function(a){
        var m = byId(DB.musteriler,'MusteriID',a.MusteriID); if(!m) return;
        var pl=(''+a.Plaka).toLowerCase().replace(/\s+/g,''), ad=(''+m.AdSoyad).toLowerCase(), tel=(''+m.Telefon).toLowerCase();
        if(pl.indexOf(qp)>-1 || ad.indexOf(q)>-1 || tel.indexOf(q)>-1){
          var x = mapArac(a); x.MusteriAdi=m.AdSoyad; x.Telefon=m.Telefon; out.push(x);
        }
      });
      return {araclar: out.slice(0,50)};
    },
    getCustomers: function(query,page,pageSize){
      page=page||1; pageSize=pageSize||20; var q=(query||'').toLowerCase().trim();
      var rows = DB.musteriler.filter(function(m){return m.Aktif;});
      if(q) rows = rows.filter(function(m){return (m.AdSoyad+''+m.Telefon).toLowerCase().indexOf(q)>-1;});
      rows.sort(function(a,b){return (''+b.KayitTarihi).localeCompare(''+a.KayitTarihi);});
      var total=rows.length, start=(page-1)*pageSize;
      var items = rows.slice(start,start+pageSize).map(function(m){
        return {MusteriID:m.MusteriID, AdSoyad:m.AdSoyad, Telefon:m.Telefon, Notlar:m.Notlar, KayitTarihi:m.KayitTarihi};
      });
      return {items:items, total:total, page:page, pageSize:pageSize};
    },
    saveCustomer: function(d){
      if(d.MusteriID){ var m=byId(DB.musteriler,'MusteriID',d.MusteriID); if(!m) throw new Error('Müşteri bulunamadı'); m.AdSoyad=d.AdSoyad; m.Telefon=d.Telefon; m.Notlar=d.Notlar||''; }
      else { d.MusteriID=uid('M'); DB.musteriler.push({MusteriID:d.MusteriID, AdSoyad:d.AdSoyad, Telefon:d.Telefon, Notlar:d.Notlar||'', KayitTarihi:now(), Aktif:true}); }
      return d.MusteriID;
    },
    deleteCustomer: function(id){ var m=byId(DB.musteriler,'MusteriID',id); if(m) m.Aktif=false; return true; },
    getCustomerWithVehicles: function(id){
      var m=byId(DB.musteriler,'MusteriID',id); if(!m) throw new Error('Müşteri bulunamadı');
      return { musteri:{MusteriID:m.MusteriID, AdSoyad:m.AdSoyad, Telefon:m.Telefon, Notlar:m.Notlar},
        araclar: DB.araclar.filter(function(a){return a.MusteriID===id && a.Aktif;}).map(mapArac) };
    },
    saveVehicle: function(d){
      d.Plaka=(''+(d.Plaka||'')).toUpperCase().replace(/\s+/g,' ').trim();
      if(d.AracID){ var a=byId(DB.araclar,'AracID',d.AracID); if(!a) throw new Error('Araç bulunamadı');
        a.MusteriID=d.MusteriID; a.Plaka=d.Plaka; a.Tur=d.Tur; a.Marka=d.Marka||''; a.Model=d.Model||''; a.Yil=d.Yil||''; a.Notlar=d.Notlar||''; }
      else { d.AracID=uid('A'); DB.araclar.push({AracID:d.AracID, MusteriID:d.MusteriID, Plaka:d.Plaka, Tur:d.Tur, Marka:d.Marka||'', Model:d.Model||'', Yil:d.Yil||'', Notlar:d.Notlar||'', Aktif:true}); }
      return d.AracID;
    },
    deleteVehicle: function(id){ var a=byId(DB.araclar,'AracID',id); if(a) a.Aktif=false; return true; },
    getVehicleHistory: function(aracId){
      var a=byId(DB.araclar,'AracID',aracId); if(!a) throw new Error('Araç bulunamadı');
      var m=byId(DB.musteriler,'MusteriID',a.MusteriID)||{};
      var ss = DB.servisler.filter(function(s){return s.AracID===aracId;}).sort(function(x,y){return (''+y.Tarih).localeCompare(''+x.Tarih);}).map(mapServis);
      var omur = ss.reduce(function(a,s){return a+s.GenelToplam;},0);
      return { arac:mapArac(a), musteri:{MusteriID:m.MusteriID, AdSoyad:m.AdSoyad, Telefon:m.Telefon}, servisler:ss, omurToplam:r2(omur) };
    },
    createService: function(aracId){
      var a=byId(DB.araclar,'AracID',aracId); if(!a) throw new Error('Araç bulunamadı');
      DB.sonServisNo++; var no = new Date().getFullYear()+'-'+('0000'+DB.sonServisNo).slice(-4);
      var id=uid('S');
      DB.servisler.push({ServisID:id, AracID:aracId, ServisNo:no, Tarih:now(), Durum:'Beklemede', GenelNot:'', KdvOrani:DB.settings.kdvOrani, KdvDahil:false, IscilikToplam:0, ParcaToplam:0, KdvTutar:0, GenelToplam:0});
      return id;
    },
    getServiceDetail: function(servisId){
      var s=byId(DB.servisler,'ServisID',servisId); if(!s) throw new Error('Servis bulunamadı');
      var a=byId(DB.araclar,'AracID',s.AracID)||{}; var m=byId(DB.musteriler,'MusteriID',a.MusteriID)||{};
      return {
        servis: mapServis(s),
        iscilikler: DB.iscilikler.filter(function(i){return i.ServisID===servisId;}).map(function(i){return {KalemID:i.KalemID, Aciklama:i.Aciklama, Tutar:num(i.Tutar)};}),
        parcalar: DB.parcalar.filter(function(p){return p.ServisID===servisId;}).map(function(p){return {KalemID:p.KalemID, ParcaAdi:p.ParcaAdi, Adet:num(p.Adet), BirimFiyat:num(p.BirimFiyat), Tutar:num(p.Tutar)};}),
        arac: mapArac(a), musteri:{MusteriID:m.MusteriID, AdSoyad:m.AdSoyad, Telefon:m.Telefon}
      };
    },
    updateServiceStatus: function(id,durum){ var s=byId(DB.servisler,'ServisID',id); if(s) s.Durum=durum; return true; },
    updateServiceMeta: function(id,meta){
      var s=byId(DB.servisler,'ServisID',id); if(!s) throw new Error('bulunamadı');
      if(meta.GenelNot!==undefined) s.GenelNot=meta.GenelNot;
      if(meta.Tarih!==undefined) s.Tarih=meta.Tarih;
      if(meta.KdvOrani!==undefined) s.KdvOrani=num(meta.KdvOrani);
      if(meta.KdvDahil!==undefined) s.KdvDahil=!!meta.KdvDahil;
      recalc(id); return Backend.getServiceDetail(id);
    },
    addIscilik: function(id,ac,tu){ DB.iscilikler.push({KalemID:uid('I'), ServisID:id, Aciklama:ac, Tutar:r2(num(tu))}); recalc(id); return Backend.getServiceDetail(id); },
    deleteIscilik: function(id,kid){ DB.iscilikler=DB.iscilikler.filter(function(i){return i.KalemID!==kid;}); recalc(id); return Backend.getServiceDetail(id); },
    addParca: function(id,ad,adet,bf){ var a=num(adet)||1, b=r2(num(bf)); DB.parcalar.push({KalemID:uid('P'), ServisID:id, ParcaAdi:ad, Adet:a, BirimFiyat:b, Tutar:r2(a*b)}); recalc(id); return Backend.getServiceDetail(id); },
    deleteParca: function(id,kid){ DB.parcalar=DB.parcalar.filter(function(p){return p.KalemID!==kid;}); recalc(id); return Backend.getServiceDetail(id); },
    deleteService: function(id){ DB.servisler=DB.servisler.filter(function(s){return s.ServisID!==id;}); DB.iscilikler=DB.iscilikler.filter(function(i){return i.ServisID!==id;}); DB.parcalar=DB.parcalar.filter(function(p){return p.ServisID!==id;}); return true; },
    getSummary: function(servisId){ var d=Backend.getServiceDetail(servisId); return {firma:DB.settings, servis:d.servis, arac:d.arac, musteri:d.musteri, iscilikler:d.iscilikler, parcalar:d.parcalar}; },
    saveSettings: function(d){ DB.settings={kdvOrani:num(d.kdvOrani), firmaAdi:d.firmaAdi||'', firmaTelefon:d.firmaTelefon||'', firmaAdres:d.firmaAdres||'', tema:DB.settings.tema||'dark'}; return DB.settings; },
    setTheme: function(t){ DB.settings.tema = (t==='light'?'light':'dark'); return DB.settings.tema; },
    getAllServices: function(f){
      f=f||{}; var page=f.page||1, pageSize=f.pageSize||25;
      var q=(''+(f.q||'')).toLowerCase().trim(), qp=q.replace(/\s+/g,'');
      var rows = DB.servisler.map(function(s){
        var a=byId(DB.araclar,'AracID',s.AracID)||{}; var m=byId(DB.musteriler,'MusteriID',a.MusteriID)||{};
        return { ServisID:s.ServisID, AracID:s.AracID, ServisNo:s.ServisNo, Tarih:''+s.Tarih, Durum:s.Durum,
          Plaka:a.Plaka||'', Tur:a.Tur||'', Marka:a.Marka||'', Model:a.Model||'',
          MusteriAdi:m.AdSoyad||'', Telefon:m.Telefon||'', GenelToplam:num(s.GenelToplam), KdvTutar:num(s.KdvTutar) };
      });
      if(f.durum) rows=rows.filter(function(r){return r.Durum===f.durum;});
      if(f.acik) rows=rows.filter(function(r){return r.Durum!=='Teslim Edildi';});
      if(f.baslangic) rows=rows.filter(function(r){return r.Tarih.substring(0,10)>=f.baslangic;});
      if(f.bitis) rows=rows.filter(function(r){return r.Tarih.substring(0,10)<=f.bitis;});
      if(q) rows=rows.filter(function(r){
        return r.Plaka.toLowerCase().replace(/\s+/g,'').indexOf(qp)>-1 || r.MusteriAdi.toLowerCase().indexOf(q)>-1 ||
          (''+r.ServisNo).toLowerCase().indexOf(q)>-1 || (''+r.Telefon).toLowerCase().indexOf(q)>-1;
      });
      rows.sort(function(a,b){return (''+b.Tarih).localeCompare(''+a.Tarih);});
      var ozet={ adet:rows.length, toplamCiro:0, toplamKdv:0, durumSayilari:{'Beklemede':0,'Devam Ediyor':0,'Tamamlandi':0,'Teslim Edildi':0} };
      rows.forEach(function(r){ ozet.toplamCiro+=r.GenelToplam; ozet.toplamKdv+=r.KdvTutar; if(ozet.durumSayilari[r.Durum]!==undefined) ozet.durumSayilari[r.Durum]++; });
      ozet.toplamCiro=r2(ozet.toplamCiro); ozet.toplamKdv=r2(ozet.toplamKdv);
      var total=rows.length, start=(page-1)*pageSize;
      return { items:rows.slice(start,start+pageSize), total:total, page:page, pageSize:pageSize, ozet:ozet };
    }
  };

  // google.script.run taklidi (her erişimde taze handler seti)
  function makeRunner(){
    var ok, fail;
    var runner = { withSuccessHandler:function(f){ok=f;return runner;}, withFailureHandler:function(f){fail=f;return runner;} };
    Object.keys(Backend).forEach(function(name){
      runner[name] = function(){
        var args = arguments;
        setTimeout(function(){ try{ var r=Backend[name].apply(null,args); ok&&ok(r); }catch(e){ fail&&fail(e); } }, 80);
      };
    });
    return runner;
  }
  window.google = { script: { get run(){ return makeRunner(); }, host:{close:function(){}} } };
})();
</script>

<script>
/* =========================================================================
 * OtoKay-T — İstemci tarafı uygulama mantığı
 * ========================================================================= */
var App = (function () {
  var state = {
    settings: { kdvOrani: 20, firmaAdi: 'Teminat Group', firmaTelefon: '', firmaAdres: '', tema: 'dark' },
    durumlar: ['Beklemede', 'Devam Ediyor', 'Tamamlandi', 'Teslim Edildi'],
    customerPage: 1,
    customerQuery: '',
    searchTimer: null,
    sheetUrl: '',
    currentView: '',
    report: { q: '', durum: '', baslangic: '', bitis: '', page: 1 }
  };

  /* ---- google.script.run -> Promise sarmalayıcı ---- */
  function call(fn, args) {
    args = args || [];
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (e) { reject(e); })
        [fn].apply(null, args);
    });
  }

  /* =======================================================================
   * İSTEMCİ ÖNBELLEĞİ (perceived performance)
   * Uygulama tek kullanıcılı olduğundan, açılan ekranlar hafızada tutulur ve
   * tekrar gidildiğinde ANINDA gösterilir; arka planda tazelenir (stale-while-
   * revalidate). Kendi yaptığımız değişikliklerde ilgili önbellek temizlenir.
   * ===================================================================== */
  var dataCache = {};      // key -> { v: value, t: timestamp }
  var SWR_TTL = 60000;     // 60 sn: bu süre içinde taze sayılır, arka plan yenilemesi atlanır
  function cacheClear(prefix) {
    if (!prefix) { dataCache = {}; return; }
    Object.keys(dataCache).forEach(function (key) {
      if (key.indexOf(prefix) === 0) delete dataCache[key];
    });
  }
  function cachePut(key, val) { dataCache[key] = { v: val, t: Date.now() }; }

  /**
   * Stale-while-revalidate yükleyici (girdi alanı olmayan salt-okunur ekranlar için).
   * Önbellekteki veriyi hemen render eder, arka planda tazeler, kullanıcı hâlâ aynı
   * ekrandaysa taze veriyle yeniden render eder.
   */
  function swr(key, fn, args, render) {
    state.currentView = key;
    var c = dataCache[key];
    if (c) render(c.v);
    else setView('<div class="loading">Yükleniyor…</div>');
    if (c && (Date.now() - c.t) < SWR_TTL) return; // taze: ağ isteğini atla
    call(fn, args).then(function (res) {
      cachePut(key, res);
      if (state.currentView === key) render(res);
    }).catch(function (e) { if (!c) failHandler(e); });
  }

  /* ---- Yardımcılar ---- */
  function $(sel, root) { return (root || document).querySelector(sel); }
  function el(html) { var d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
  function esc(s) {
    return ('' + (s === null || s === undefined ? '' : s))
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function money(n) {
    return Number(n || 0).toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ₺';
  }
  function badgeClass(d) { return 'badge ' + (d || '').replace(/\s+/g, ''); }
  function setView(html) { $('#view').innerHTML = html; }
  function toast(msg, type) {
    var t = $('#toast');
    t.textContent = msg; t.className = 'toast ' + (type || '');
    setTimeout(function () { t.className = 'toast hidden'; }, 3000);
  }
  function busy(on) { /* basit görsel geri bildirim için yer tutucu */ }

  /* =======================================================================
   * BAŞLATMA
   * ===================================================================== */
  function init() {
    call('getBootstrapData').then(function (data) {
      state.settings = data.settings;
      state.durumlar = data.durumlar;
      state.sheetUrl = data.sheetUrl || '';
      cachePut('boot', data);
      $('#brandName').textContent = data.settings.firmaAdi || 'Teminat Group';
      applyTheme(data.settings.tema || 'dark');
      state.currentView = 'boot';
      renderHome(data.stats);
    }).catch(function (e) {
      setView('<div class="card"><h2>Kurulum gerekli</h2><p>' + esc(e.message || e) +
        '</p><p class="muted">Apps Script editöründen <b>setupSpreadsheet</b> fonksiyonunu bir kez çalıştırın.</p></div>');
    });
  }

  function goHome() {
    activateTab('home');
    swr('boot', 'getBootstrapData', [], function (d) {
      state.settings = d.settings;
      state.sheetUrl = d.sheetUrl || '';
      renderHome(d.stats);
    });
  }

  function tab(name) {
    activateTab(name);
    if (name === 'home') goHome();
    else if (name === 'customers') { state.customerPage = 1; state.customerQuery = ''; loadCustomers(); }
    else if (name === 'reports') loadReports();
  }
  function activateTab(name) {
    document.querySelectorAll('.tab').forEach(function (t) {
      t.classList.toggle('active', t.dataset.tab === name);
    });
  }

  /* ---- Tema ---- */
  function applyTheme(tema) {
    document.documentElement.setAttribute('data-theme', tema === 'light' ? 'light' : 'dark');
    var btn = $('#themeBtn');
    if (btn) { btn.textContent = tema === 'light' ? '☀️' : '🌙'; btn.title = tema === 'light' ? 'Koyu temaya geç' : 'Açık temaya geç'; }
    state.settings.tema = tema;
  }
  function toggleTheme() {
    var next = state.settings.tema === 'light' ? 'dark' : 'light';
    applyTheme(next);                       // anında uygula
    call('setTheme', [next]).catch(function () {}); // arka planda kaydet
  }

  /* ---- Google E-Tablo kısayolu ---- */
  function openSheet() {
    if (state.sheetUrl) window.open(state.sheetUrl, '_blank');
    else toast('E-Tablo bağlantısı bulunamadı (kurulumu tamamlayın).', 'err');
  }

  /* =======================================================================
   * ANA SAYFA
   * ===================================================================== */
  function renderHome(stats) {
    setView(
      '<div class="stats">' +
        stat(stats.acikServis, 'Açık İş Emri', "App.tab('reports')") +
        stat(stats.aracSayisi, 'Kayıtlı Araç', '') +
        stat(stats.musteriSayisi, 'Müşteri', "App.tab('customers')") +
        stat(stats.toplamServis, 'Toplam Servis', "App.tab('reports')") +
      '</div>' +
      '<div class="card" style="margin-top:14px">' +
        '<h3>Hızlı İşlem</h3>' +
        '<div class="btn-row">' +
          '<button class="btn" onclick="App.newCustomerModal()">+ Yeni Müşteri</button>' +
          '<button class="btn secondary" onclick="App.tab(\'reports\')">📊 Raporlar</button>' +
          '<button class="btn secondary" onclick="App.tab(\'customers\')">👤 Müşteri Listesi</button>' +
        '</div>' +
        '<p class="muted" style="margin-top:14px">💡 Üstteki arama kutusundan <b>plaka</b>, <b>müşteri adı</b> ' +
        'veya <b>telefon</b> ile araç bulabilirsiniz. Yeni iş emri açmak için önce aracı bulun.</p>' +
      '</div>'
    );
  }
  function stat(num, lbl, onclick) {
    var c = onclick ? ' style="cursor:pointer" onclick="' + onclick + '"' : '';
    return '<div class="stat"' + c + '><div class="num">' + (num || 0) + '</div><div class="lbl">' + lbl + '</div></div>';
  }

  /* =======================================================================
   * RAPORLAR — Tüm iş emirleri
   * ===================================================================== */
  var reportTimer = null;
  function loadReports() {
    var r = state.report;
    var f = { q: r.q, durum: r.durum, baslangic: r.baslangic, bitis: r.bitis, page: r.page, pageSize: 25 };
    swr('rep:' + JSON.stringify(f), 'getAllServices', [f], renderReports);
  }
  function setReportFilter(key, val) {
    state.report[key] = val; state.report.page = 1;
    if (key === 'q') state._refocusReport = true;
    clearTimeout(reportTimer);
    reportTimer = setTimeout(loadReports, key === 'q' ? 250 : 0);
  }
  function reportThisMonth() {
    var d = new Date();
    var p = function (x) { return ('0' + x).slice(-2); };
    state.report.baslangic = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-01';
    state.report.bitis = d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate());
    state.report.page = 1; loadReports();
  }
  function reportClear() {
    state.report = { q: '', durum: '', baslangic: '', bitis: '', page: 1 }; loadReports();
  }
  function reportPage(p) { state.report.page = p; loadReports(); }

  function renderReports(res) {
    var r = state.report, o = res.ozet;
    var totalPages = Math.max(1, Math.ceil(res.total / res.pageSize));
    var durumOpts = ['<option value="">Tüm Durumlar</option>'].concat(state.durumlar.map(function (d) {
      return '<option value="' + d + '" ' + (r.durum === d ? 'selected' : '') + '>' + d + '</option>';
    })).join('');

    var html =
      '<div class="stats">' +
        stat(o.adet, 'İş Emri', '') +
        '<div class="stat"><div class="num" style="font-size:22px">' + money(o.toplamCiro) + '</div><div class="lbl">Toplam Ciro</div></div>' +
        '<div class="stat"><div class="num" style="font-size:22px">' + money(o.toplamKdv) + '</div><div class="lbl">Toplam KDV</div></div>' +
        stat(o.durumSayilari['Beklemede'] + o.durumSayilari['Devam Ediyor'] + o.durumSayilari['Tamamlandi'], 'Açık (teslim bekleyen)', '') +
      '</div>' +
      '<div class="card" style="margin-top:14px">' +
        '<div class="row">' +
          '<div style="flex:2"><label>Ara (plaka / müşteri / iş emri no)</label>' +
            '<input id="repSearch" value="' + esc(r.q) + '" oninput="App.setReportFilter(\'q\', this.value)" placeholder="Ara..."></div>' +
          '<div style="flex:1"><label>Durum</label><select onchange="App.setReportFilter(\'durum\', this.value)">' + durumOpts + '</select></div>' +
        '</div>' +
        '<div class="row" style="margin-top:6px;align-items:flex-end">' +
          '<div><label>Başlangıç</label><input type="date" value="' + esc(r.baslangic) + '" onchange="App.setReportFilter(\'baslangic\', this.value)"></div>' +
          '<div><label>Bitiş</label><input type="date" value="' + esc(r.bitis) + '" onchange="App.setReportFilter(\'bitis\', this.value)"></div>' +
          '<button class="btn secondary sm" onclick="App.reportThisMonth()">Bu Ay</button>' +
          '<button class="btn secondary sm" onclick="App.reportClear()">Temizle</button>' +
        '</div>' +
      '</div>' +
      '<div class="card">';

    if (!res.items.length) {
      html += '<div class="empty">Kayıt bulunamadı.</div>';
    } else {
      html += '<table><thead><tr><th>No</th><th class="hide-sm">Tarih</th><th>Plaka</th>' +
        '<th class="hide-sm">Müşteri</th><th>Durum</th><th class="right">Tutar</th></tr></thead><tbody>' +
        res.items.map(function (s) {
          return '<tr style="cursor:pointer" onclick="App.openService(\'' + s.ServisID + '\')">' +
            '<td><b>' + esc(s.ServisNo) + '</b></td>' +
            '<td class="hide-sm">' + esc(s.Tarih) + '</td>' +
            '<td><span class="sr-plaka">' + esc(s.Plaka) + '</span></td>' +
            '<td class="hide-sm">' + esc(s.MusteriAdi) + '</td>' +
            '<td><span class="' + badgeClass(s.Durum) + '">' + esc(s.Durum) + '</span></td>' +
            '<td class="right">' + money(s.GenelToplam) + '</td></tr>';
        }).join('') +
        '</tbody></table>' +
        '<div class="pagination">' +
          '<button class="btn secondary sm" ' + (res.page <= 1 ? 'disabled' : '') + ' onclick="App.reportPage(' + (res.page - 1) + ')">‹ Önceki</button>' +
          '<span class="muted">' + res.page + ' / ' + totalPages + ' (' + res.total + ' kayıt)</span>' +
          '<button class="btn secondary sm" ' + (res.page >= totalPages ? 'disabled' : '') + ' onclick="App.reportPage(' + (res.page + 1) + ')">Sonraki ›</button>' +
        '</div>';
    }
    html += '</div>';
    setView(html);
    if (state._refocusReport) {
      state._refocusReport = false;
      var inp = $('#repSearch');
      if (inp) { inp.focus(); var v = inp.value; inp.value = ''; inp.value = v; } // caret sona
    }
  }

  /* =======================================================================
   * GLOBAL ARAMA (plaka / müşteri / telefon)
   * ===================================================================== */
  function onSearchInput() {
    clearTimeout(state.searchTimer);
    var q = $('#globalSearch').value.trim();
    if (q.length < 2) { hideSearch(); return; }
    state.searchTimer = setTimeout(function () { runSearch(q); }, 250);
  }
  function onSearchKey(e) {
    if (e.key === 'Escape') hideSearch();
  }
  function runSearch(q) {
    call('search', [q]).then(function (res) {
      var box = $('#searchResults');
      if (!res.araclar.length) {
        box.innerHTML = '<div class="sr-item muted">Sonuç yok</div>';
      } else {
        box.innerHTML = res.araclar.map(function (a) {
          return '<div class="sr-item" onclick="App.openVehicle(\'' + a.AracID + '\')">' +
            '<div><div class="sr-plaka">' + esc(a.Plaka) + ' <span class="badge tur">' + esc(a.Tur) + '</span></div>' +
            '<div class="sr-meta">' + esc(a.Marka) + ' ' + esc(a.Model) + '</div></div>' +
            '<div class="sr-meta right">' + esc(a.MusteriAdi) + '<br>' + esc(a.Telefon) + '</div>' +
          '</div>';
        }).join('');
      }
      box.classList.remove('hidden');
    });
  }
  function hideSearch() { $('#searchResults').classList.add('hidden'); }
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.search-wrap')) hideSearch();
  });

  /* =======================================================================
   * MÜŞTERİLER
   * ===================================================================== */
  function loadCustomers() {
    var key = 'cust:' + state.customerQuery + ':' + state.customerPage;
    swr(key, 'getCustomers', [state.customerQuery, state.customerPage, 20], renderCustomers);
  }
  function renderCustomers(res) {
    var totalPages = Math.max(1, Math.ceil(res.total / res.pageSize));
    var html =
      '<div class="card">' +
        '<div class="section-head"><h2>Müşteriler (' + res.total + ')</h2>' +
        '<button class="btn" onclick="App.newCustomerModal()">+ Yeni</button></div>' +
        '<div class="field"><input id="custFilter" placeholder="Ad veya telefon ile filtrele..." ' +
          'value="' + esc(state.customerQuery) + '" oninput="App.filterCustomers(this.value)"></div>';
    if (!res.items.length) {
      html += '<div class="empty">Kayıt bulunamadı.</div>';
    } else {
      html += res.items.map(function (m) {
        return '<div class="list-item" onclick="App.openCustomer(\'' + m.MusteriID + '\')">' +
          '<div><b>' + esc(m.AdSoyad) + '</b><div class="meta">' + esc(m.Telefon || '—') + '</div></div>' +
          '<div class="meta">›</div></div>';
      }).join('');
      html +=
        '<div class="pagination">' +
          '<button class="btn secondary sm" ' + (res.page <= 1 ? 'disabled' : '') + ' onclick="App.custPage(' + (res.page - 1) + ')">‹ Önceki</button>' +
          '<span class="muted">' + res.page + ' / ' + totalPages + '</span>' +
          '<button class="btn secondary sm" ' + (res.page >= totalPages ? 'disabled' : '') + ' onclick="App.custPage(' + (res.page + 1) + ')">Sonraki ›</button>' +
        '</div>';
    }
    html += '</div>';
    setView(html);
    if (state._refocusCust) {
      state._refocusCust = false;
      var inp = $('#custFilter');
      if (inp) { inp.focus(); var v = inp.value; inp.value = ''; inp.value = v; }
    }
  }
  var custFilterTimer = null;
  function filterCustomers(v) {
    state._refocusCust = true;
    clearTimeout(custFilterTimer);
    custFilterTimer = setTimeout(function () {
      state.customerQuery = v; state.customerPage = 1;
      loadCustomers();
    }, 250);
  }
  function custPage(p) { state.customerPage = p; loadCustomers(); }

  function newCustomerModal(prefill) {
    customerForm(null, prefill);
  }
  function customerForm(c, prefill) {
    c = c || {};
    var title = c.MusteriID ? 'Müşteriyi Düzenle' : 'Yeni Müşteri';
    openModal(title,
      field('Ad Soyad *', '<input id="cAd" value="' + esc(c.AdSoyad || '') + '">') +
      field('Telefon', '<input id="cTel" placeholder="05xx..." value="' + esc(c.Telefon || (prefill && prefill.tel) || '') + '">') +

  /* =======================================================================
   * SERVİS / İŞ EMRİ DETAYI
   * ===================================================================== */
  function newService(aracId) {
    call('createService', [aracId]).then(function (servisId) {
      cacheClear('veh:' + aracId); cacheClear('rep:'); cacheClear('boot');
      toast('Yeni iş emri açıldı', 'ok'); openService(servisId);
    }).catch(failHandler);
  }
  // İş emri ekranında girdi alanları olduğundan otomatik arka plan yenilemesi yapmıyoruz:
  // önbellek tazeyse anında gösterilir, kendi değişikliklerimiz önbelleği günceller.
  function openService(servisId) {
    var key = 'svc:' + servisId;
    state.currentView = key;
    var c = dataCache[key];
    if (c) { renderService(c.v); if ((Date.now() - c.t) < SWR_TTL) return; }
    else setView('<div class="loading">Yükleniyor…</div>');
    call('getServiceDetail', [servisId]).then(function (res) {
      cachePut(key, res);
      if (state.currentView === key) renderService(res);
    }).catch(function (e) { if (!c) failHandler(e); });
  }
  function renderService(d) {
    var s = d.servis, a = d.arac, m = d.musteri;
    var araToplam = s.IscilikToplam + s.ParcaToplam;
    // KDV dahil işaretliyse kalemler/satırlar KDV eklenmiş gösterilir.
    var k = s.KdvDahil ? (1 + s.KdvOrani / 100) : 1;
    var kdvDahil = s.KdvDahil;
    var durumOpts = state.durumlar.map(function (x) {
      return '<option ' + (s.Durum === x ? 'selected' : '') + '>' + x + '</option>';
    }).join('');

    var html =
      '<div class="breadcrumb" onclick="App.openVehicle(\'' + a.AracID + '\')">‹ ' + esc(a.Plaka) + ' geçmişi</div>' +
      '<div class="card">' +
        '<div class="section-head">' +
          '<h2>İş Emri ' + esc(s.ServisNo) + '</h2>' +
          '<select onchange="App.changeStatus(\'' + s.ServisID + '\', this.value)" style="width:auto">' + durumOpts + '</select>' +
        '</div>' +
        '<div class="meta sr-plaka">' + esc(a.Plaka) + ' · ' + esc(a.Marka) + ' ' + esc(a.Model) + '</div>' +
        '<div class="meta">👤 ' + esc(m.AdSoyad || '—') + '  📞 ' + esc(m.Telefon || '—') + '  📅 ' + esc(s.Tarih) + '</div>' +
        '<div class="field" style="margin-top:10px"><label>Genel Not</label>' +
          '<textarea id="svcNot" onblur="App.saveNot(\'' + s.ServisID + '\', this.value)">' + esc(s.GenelNot || '') + '</textarea></div>' +
      '</div>' +

      /* İŞÇİLİK */
      '<div class="card">' +
        '<h3>🔧 İşçilik</h3>' +
        '<table><thead><tr><th>Açıklama</th><th class="right">Tutar' + (kdvDahil ? ' <span class="muted">(KDV dahil)</span>' : '') + '</th><th></th></tr></thead><tbody>' +
        (d.iscilikler.length ? d.iscilikler.map(function (i) {
          return '<tr><td>' + esc(i.Aciklama) + '</td><td class="right">' + money(i.Tutar * k) + '</td>' +
            '<td class="right"><button class="btn red sm" onclick="App.delIscilik(\'' + s.ServisID + '\',\'' + i.KalemID + '\')">✕</button></td></tr>';
        }).join('') : '<tr><td colspan="3" class="muted">Kalem yok.</td></tr>') +
        '</tbody></table>' +
        '<div class="row" style="margin-top:10px;align-items:flex-end">' +
          '<div style="flex:3"><label>Açıklama</label><input id="iAciklama" placeholder="Örn: Yağ değişimi işçiliği" onkeydown="if(event.key===\'Enter\')App.addIscilik(\'' + s.ServisID + '\')"></div>' +
          '<div style="flex:1"><label>Tutar</label><input id="iTutar" inputmode="decimal" placeholder="0" onkeydown="if(event.key===\'Enter\')App.addIscilik(\'' + s.ServisID + '\')"></div>' +
          '<button class="btn sm" onclick="App.addIscilik(\'' + s.ServisID + '\')">Ekle</button>' +
        '</div>' +
      '</div>' +

      /* PARÇA */
      '<div class="card">' +
        '<h3>🧩 Parça</h3>' +
        '<table><thead><tr><th>Parça</th><th class="right hide-sm">Adet</th><th class="right hide-sm">Birim' + (kdvDahil ? ' <span class="muted">(KDV\'li)</span>' : '') + '</th><th class="right">Tutar' + (kdvDahil ? ' <span class="muted">(KDV\'li)</span>' : '') + '</th><th></th></tr></thead><tbody>' +
        (d.parcalar.length ? d.parcalar.map(function (p) {
          return '<tr><td>' + esc(p.ParcaAdi) + '</td>' +
            '<td class="right hide-sm">' + p.Adet + '</td>' +
            '<td class="right hide-sm">' + money(p.BirimFiyat * k) + '</td>' +
            '<td class="right">' + money(p.Tutar * k) + '</td>' +
            '<td class="right"><button class="btn red sm" onclick="App.delParca(\'' + s.ServisID + '\',\'' + p.KalemID + '\')">✕</button></td></tr>';
        }).join('') : '<tr><td colspan="5" class="muted">Kalem yok.</td></tr>') +
        '</tbody></table>' +
        '<div class="row" style="margin-top:10px;align-items:flex-end">' +
          '<div style="flex:3"><label>Parça Adı</label><input id="pAd" placeholder="Örn: Yağ filtresi" onkeydown="if(event.key===\'Enter\')App.addParca(\'' + s.ServisID + '\')"></div>' +
          '<div style="flex:1"><label>Adet</label><input id="pAdet" inputmode="decimal" value="1" onkeydown="if(event.key===\'Enter\')App.addParca(\'' + s.ServisID + '\')"></div>' +
          '<div style="flex:1"><label>Birim Fiyat</label><input id="pFiyat" inputmode="decimal" placeholder="0" onkeydown="if(event.key===\'Enter\')App.addParca(\'' + s.ServisID + '\')"></div>' +
          '<button class="btn sm" onclick="App.addParca(\'' + s.ServisID + '\')">Ekle</button>' +
        '</div>' +
      '</div>' +

      /* TOPLAM + KDV */
      '<div class="card">' +
        '<h3>💰 Toplam</h3>' +
        (kdvDahil
          ? '<div class="total-line"><span>İşçilik <span class="muted">(KDV dahil)</span></span><span>' + money(s.IscilikToplam * k) + '</span></div>' +
            '<div class="total-line"><span>Parça <span class="muted">(KDV dahil)</span></span><span>' + money(s.ParcaToplam * k) + '</span></div>' +
            '<div class="total-line"><span class="muted">Net (KDV hariç)</span><span class="muted">' + money(araToplam) + '</span></div>'
          : '<div class="total-line"><span>İşçilik</span><span>' + money(s.IscilikToplam) + '</span></div>' +
            '<div class="total-line"><span>Parça</span><span>' + money(s.ParcaToplam) + '</span></div>' +
            '<div class="total-line"><span>Ara Toplam</span><span>' + money(araToplam) + '</span></div>') +
        '<div class="row" style="margin:10px 0;align-items:flex-end">' +
          '<div style="flex:1"><label>KDV Oranı (%)</label><input id="kdvOran" inputmode="decimal" value="' + s.KdvOrani + '" onchange="App.saveKdv(\'' + s.ServisID + '\')"></div>' +
          '<div style="flex:2" class="checkbox-field"><input type="checkbox" id="kdvDahil" ' + (s.KdvDahil ? 'checked' : '') + ' onchange="App.saveKdv(\'' + s.ServisID + '\')"><label style="margin:0">Kalemleri KDV dahil göster</label></div>' +
        '</div>' +
        '<div class="total-line"><span>' + (kdvDahil ? 'İçindeki ' : '') + 'KDV (' + s.KdvOrani + '%)</span><span>' + money(s.KdvTutar) + '</span></div>' +
        '<div class="total-line grand"><span>GENEL TOPLAM</span><span>' + money(s.GenelToplam) + '</span></div>' +
        '<div class="btn-row" style="margin-top:14px">' +
          '<button class="btn green" onclick="App.showSummary(\'' + s.ServisID + '\')">📄 Müşteri Özeti</button>' +
          '<button class="btn red secondary" onclick="App.delService(\'' + s.ServisID + '\',\'' + a.AracID + '\')">İş Emrini Sil</button>' +
        '</div>' +
      '</div>';
    setView(html);
  }

  // Bir iş emri değiştiğinde: önbelleği tazele (svc) + etkilenen ekranları geçersiz kıl.
  function onSvcChanged(res) {
    cachePut('svc:' + res.servis.ServisID, res);
    cacheClear('veh:'); cacheClear('rep:'); cacheClear('boot');
    if (state.currentView === 'svc:' + res.servis.ServisID) renderService(res);
  }
  function changeStatus(id, durum) {
    call('updateServiceStatus', [id, durum]).then(function () {
      var c = dataCache['svc:' + id]; if (c) c.v.servis.Durum = durum; // önbellekteki durumu güncelle
      cacheClear('veh:'); cacheClear('rep:'); cacheClear('boot');
      toast('Durum güncellendi', 'ok');
    }).catch(failHandler);
  }
  function saveNot(id, val) {
    call('updateServiceMeta', [id, { GenelNot: val }]).then(function (res) {
      cachePut('svc:' + id, res); // yeniden render etmeden önbelleği güncelle (yazılan not silinmesin)
    }).catch(failHandler);
  }
  function saveKdv(id) {
    var oran = $('#kdvOran').value;
    var dahil = $('#kdvDahil').checked;
    call('updateServiceMeta', [id, { KdvOrani: oran, KdvDahil: dahil }]).then(onSvcChanged).catch(failHandler);
  }
  function addIscilik(id) {
    var ac = $('#iAciklama').value.trim(), tu = $('#iTutar').value;
    if (!ac) { toast('Açıklama girin', 'err'); return; }
    call('addIscilik', [id, ac, tu]).then(onSvcChanged).catch(failHandler);
  }
  function delIscilik(id, kid) { call('deleteIscilik', [id, kid]).then(onSvcChanged).catch(failHandler); }
  function addParca(id) {
    var ad = $('#pAd').value.trim(), adet = $('#pAdet').value, fiyat = $('#pFiyat').value;
    if (!ad) { toast('Parça adı girin', 'err'); return; }
    call('addParca', [id, ad, adet, fiyat]).then(onSvcChanged).catch(failHandler);
  }
  function delParca(id, kid) { call('deleteParca', [id, kid]).then(onSvcChanged).catch(failHandler); }
  function delService(id, aracId) {
    confirmModal('Bu iş emri ve tüm kalemleri kalıcı olarak silinecek. Emin misiniz?', function () {
      call('deleteService', [id]).then(function () {
        cacheClear('svc:' + id); cacheClear('veh:'); cacheClear('rep:'); cacheClear('boot');
        toast('İş emri silindi', 'ok'); openVehicle(aracId);
      }).catch(failHandler);
    });
  }

  /* =======================================================================
   * MÜŞTERİ ÖZETİ — yazdır + WhatsApp
   * ===================================================================== */

        '<div class="summary-sheet" id="summarySheet">' +
          '<div class="summary-head">' +
            '<div><h2 style="margin:0">' + esc(f.firmaAdi) + '</h2>' +

          '</div>' +
          '<p><b>Müşteri:</b> ' + esc(m.AdSoyad || '—') + ' &nbsp; <b>Tel:</b> ' + esc(m.Telefon || '—') + '<br>' +
          '<b>Araç:</b> ' + esc(a.Plaka) + ' — ' + esc(a.Marka) + ' ' + esc(a.Model) + ' ' + esc(a.Yil || '') + ' (' + esc(a.Tur) + ')</p>' +
          (s.GenelNot ? '<p><b>Not:</b> ' + esc(s.GenelNot) + '</p>' : '') +

          (d.iscilikler.length ? '<h3>İşçilik</h3><table><thead><tr><th>Açıklama</th><th class="right">Tutar' + (kdvDahil ? ' (KDV dahil)' : '') + '</th></tr></thead><tbody>' +
            d.iscilikler.map(function (i) {
              return '<tr><td>' + esc(i.Aciklama) + '</td><td class="right">' + money(i.Tutar * k) + '</td></tr>';
            }).join('') + '</tbody></table>' : '') +

          (d.parcalar.length ? '<h3>Parça</h3><table><thead><tr><th>Parça</th><th class="right">Adet</th><th class="right">Birim' + (kdvDahil ? ' (KDV\'li)' : '') + '</th><th class="right">Tutar' + (kdvDahil ? ' (KDV\'li)' : '') + '</th></tr></thead><tbody>' +
            d.parcalar.map(function (p) {
              return '<tr><td>' + esc(p.ParcaAdi) + '</td><td class="right">' + p.Adet + '</td><td class="right">' + money(p.BirimFiyat * k) + '</td><td class="right">' + money(p.Tutar * k) + '</td></tr>';
            }).join('') + '</tbody></table>' : '') +

          '<div style="margin-top:16px">' +
            (kdvDahil
              ? '<div class="total-line"><span>İşçilik (KDV dahil)</span><span>' + money(s.IscilikToplam * k) + '</span></div>' +

              : '<div class="total-line"><span>İşçilik Toplam</span><span>' + money(s.IscilikToplam) + '</span></div>' +

      ], 'wide');

  function sendWhatsApp(d) {
    var s = d.servis, a = d.arac, m = d.musteri, f = d.firma;
    var k = s.KdvDahil ? (1 + s.KdvOrani / 100) : 1;
    var kdvDahil = s.KdvDahil;
    var L = [];
    L.push('*' + f.firmaAdi + '*');
    L.push('İş Emri: ' + s.ServisNo + ' (' + s.Tarih + ')');
    L.push('Araç: ' + a.Plaka + ' - ' + a.Marka + ' ' + a.Model);
    L.push('');
    if (d.iscilikler.length) {
      L.push('🔧 *İşçilik*' + (kdvDahil ? ' (KDV dahil)' : ''));
      d.iscilikler.forEach(function (i) { L.push('• ' + i.Aciklama + ': ' + money(i.Tutar * k)); });
      L.push('');
    }
    if (d.parcalar.length) {
      L.push('🧩 *Parça*' + (kdvDahil ? ' (KDV dahil)' : ''));
      d.parcalar.forEach(function (p) { L.push('• ' + p.ParcaAdi + ' x' + p.Adet + ': ' + money(p.Tutar * k)); });
      L.push('');
    }
    L.push('İşçilik: ' + money(s.IscilikToplam * k));
    L.push('Parça: ' + money(s.ParcaToplam * k));
    L.push((kdvDahil ? 'İçindeki ' : '') + 'KDV (' + s.KdvOrani + '%): ' + money(s.KdvTutar));
    L.push('*GENEL TOPLAM: ' + money(s.GenelToplam) + '*');

    var text = encodeURIComponent(L.join('\n'));
    var tel = ('' + (m.Telefon || '')).replace(/\D/g, '');
    if (tel.length === 10) tel = '90' + tel;                 // 5xx... -> 905xx...
    else if (tel.length === 11 && tel.charAt(0) === '0') tel = '90' + tel.substring(1); // 05xx... -> 905xx...
    var url = (tel ? 'https://wa.me/' + tel : 'https://wa.me/') + '?text=' + text;
    window.open(url, '_blank');
  }

  /* =======================================================================
   * AYARLAR
   * ===================================================================== */
  function openSettings() {
    var s = state.settings;
    openModal('Ayarlar',
      field('Firma Adı', '<input id="setAd" value="' + esc(s.firmaAdi) + '">') +
      field('Firma Telefonu', '<input id="setTel" value="' + esc(s.firmaTelefon) + '">') +
      field('Firma Adresi', '<textarea id="setAdres">' + esc(s.firmaAdres) + '</textarea>') +
      field('Varsayılan KDV Oranı (%)', '<input id="setKdv" inputmode="decimal" value="' + esc(s.kdvOrani) + '">'),
      [
        { label: 'İptal', cls: 'secondary', fn: closeModal },
        { label: 'Kaydet', cls: '', fn: function () {
          var data = {
            firmaAdi: $('#setAd').value.trim(),
            firmaTelefon: $('#setTel').value.trim(),
            firmaAdres: $('#setAdres').value.trim(),
            kdvOrani: $('#setKdv').value
          };
          call('saveSettings', [data]).then(function (res) {
            state.settings = res;
            cacheClear('boot');
            $('#brandName').textContent = res.firmaAdi || 'Teminat Group';
            closeModal(); toast('Ayarlar kaydedildi', 'ok');
          }).catch(failHandler);
        } }
      ]
    );
  }

  /* =======================================================================
   * MODAL / GENEL
   * ===================================================================== */
  function field(label, inputHtml) {
    return '<div class="field"><label>' + label + '</label>' + inputHtml + '</div>';
  }
  function openModal(title, bodyHtml, buttons, extraCls) {
    var footer = (buttons || []).map(function (b, idx) {
      return '<button class="btn ' + (b.cls || '') + '" data-mbtn="' + idx + '">' + b.label + '</button>';
    }).join('');
    var overlay = el(
      '<div class="modal-overlay">' +
        '<div class="modal ' + (extraCls || '') + '">' +
          '<div class="modal-head"><h3>' + esc(title) + '</h3>' +
            '<button class="icon-btn no-print" data-mclose>✕</button></div>' +
          '<div class="modal-body">' + bodyHtml + '</div>' +
          (footer ? '<div class="modal-foot">' + footer + '</div>' : '') +
        '</div>' +
      '</div>'
    );
    overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });
    overlay.querySelector('[data-mclose]').addEventListener('click', closeModal);
    (buttons || []).forEach(function (b, idx) {
      overlay.querySelector('[data-mbtn="' + idx + '"]').addEventListener('click', b.fn);
    });
    $('#modalRoot').innerHTML = '';
    $('#modalRoot').appendChild(overlay);
  }
  function closeModal() { $('#modalRoot').innerHTML = ''; }
  function confirmModal(msg, onYes) {
    openModal('Onay', '<p>' + esc(msg) + '</p>', [
      { label: 'Vazgeç', cls: 'secondary', fn: closeModal },
      { label: 'Evet', cls: 'red', fn: function () { closeModal(); onYes(); } }
    ]);
  }
  function failHandler(e) {
    console.error(e);
    toast((e && e.message) ? e.message : 'Bir hata oluştu', 'err');
  }

  /* ---- Dışa açılan API ---- */
  return {
    init: init, goHome: goHome, tab: tab,
    toggleTheme: toggleTheme, openSheet: openSheet,
    loadReports: loadReports, setReportFilter: setReportFilter,
    reportThisMonth: reportThisMonth, reportClear: reportClear, reportPage: reportPage,
    onSearchInput: onSearchInput, onSearchKey: onSearchKey,
    loadCustomers: loadCustomers, filterCustomers: filterCustomers, custPage: custPage,
    newCustomerModal: newCustomerModal, openCustomer: openCustomer, editCustomer: editCustomer, delCustomer: delCustomer,
    newVehicleModal: newVehicleModal, openVehicle: openVehicle, editVehicle: editVehicle,
    newService: newService, openService: openService, changeStatus: changeStatus,
    saveNot: saveNot, saveKdv: saveKdv,
    addIscilik: addIscilik, delIscilik: delIscilik, addParca: addParca, delParca: delParca,
    delService: delService, showSummary: showSummary, openSettings: openSettings
  };
})();

window.addEventListener('DOMContentLoaded', App.init);
</script>
